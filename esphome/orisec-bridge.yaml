# =============================================================================
# Orisec panel <-> Home Assistant serial bridge (ESP32, ESPHome)
# See README.md in this folder for wiring, panel settings and first flash.
# -----------------------------------------------------------------------------
# WIRING (panel COM port in Mode 0 = W-RKP/UDL, 115200):
#   panel T  -> ESP32 GPIO16 (RX2)
#   panel R  -> ESP32 GPIO17 (TX2)
#   panel 0V -> ESP32 GND        | panel +12V -> LEAVE DISCONNECTED
# Then point the Orisec integration's "Serial bridge" at <bridge IP>:6638.
# =============================================================================

substitutions:
  name: orisec-bridge
  friendly_name: Orisec Bridge
  uart_baud: "115200"   # must match the panel COM port
  tcp_port: "6638"      # the port the Orisec integration connects to

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev       # any classic ESP32 dev board (WROOM-32)
  framework:
    type: arduino

# Raw TCP <-> UART bridge: a copy of oxan/esphome-stream-server that also drops
# dead client connections (see components/stream_server/README.md).
external_components:
  - source:
      type: git
      url: https://github.com/FarmerJack69/HA-Orisec
      ref: main
      path: esphome/components
    components: [stream_server]

logger:
  level: INFO           # logs go out over USB (UART0); the panel is on UART2

api:
  # Keep the bridge running even when HA's ESPHome link is down (the default
  # 15 min would reboot the ESP32 whenever the bridge isn't adopted in HA).
  reboot_timeout: 0s
  encryption:
    key: !secret orisec_bridge_api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if the Wi-Fi network can't be reached.
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret orisec_bridge_ap_password

captive_portal:

# ---- Panel serial link (hardware UART2) -------------------------------------
uart:
  id: uart_bus
  tx_pin: GPIO17        # -> panel R
  rx_pin: GPIO16        # <- panel T
  baud_rate: ${uart_baud}
  # 8 data bits, no parity, 1 stop bit (the defaults) match the panel.

# ---- Expose the UART as a TCP socket for the Orisec integration -------------
stream_server:
  uart_id: uart_bus
  port: ${tcp_port}

# ---- Diagnostics (shown on the keypad card's settings page when adopted) ----
binary_sensor:
  - platform: status
    name: "Status"
  - platform: stream_server
    connected:
      name: "Panel link connected"   # HA's Orisec connection is open

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"
  - platform: stream_server
    connection_count:
      name: "Panel link clients"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP address"
    ssid:
      name: "SSID"

button:
  - platform: restart
    name: "Restart"
